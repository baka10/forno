# See docs/observability.md "The pillars, wired together".
global:
  scrape_interval: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/recording_rules.yml
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: forno-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # relay/projectors have no FastAPI process of their own — they expose
  # /metrics on FORNO_METRICS_PORT (default 9100) via prometheus_client's
  # bare HTTP server. See src/forno/__main__.py and settings.py.
  - job_name: forno-outbox-relay
    static_configs:
      - targets: ["outbox-relay:9100"]
    metrics_path: /metrics

  - job_name: forno-projector-kitchen
    static_configs:
      - targets: ["projector-kitchen:9100"]
    metrics_path: /metrics

  - job_name: forno-projector-stats
    static_configs:
      - targets: ["projector-stats:9100"]
    metrics_path: /metrics

  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
