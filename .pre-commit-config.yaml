repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports --config importlinter.ini
        language: system
        pass_filenames: false

      - id: mypy-domain
        name: mypy (domain, application — strict)
        entry: uv run mypy src/forno/domain src/forno/application
        language: system
        pass_filenames: false
