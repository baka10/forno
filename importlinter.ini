; See docs/architecture.md#layering and docs/adr/0005-layered-architecture.md.
; Ten lines of configuration turn "clean architecture" from a claim into a failing build.

[importlinter]
root_packages =
    forno
    simulator
include_external_packages = True

[importlinter:contract:domain-is-pure]
name = Domain layer imports no frameworks
type = forbidden
source_modules = forno.domain
forbidden_modules =
    fastapi
    sqlalchemy
    pydantic
    aiokafka
    forno.adapters
    forno.application
    forno.contracts

; `adapters.db` is deliberately excluded from this ordering rather than listed
; above `application`: docs/architecture.md "Layering" draws APP -> DB, and
; ADR-0010 rejects inventing a repository port for every plain config/read
; table just to keep application from touching SQLAlchemy models. Only the
; `Order` aggregate gets that treatment (OrderRepository) because it is the
; one thing with FSM invariants to guard. `adapters.http` / `adapters.messaging`
; are the request/event-handling edges and stay strictly above `application`.
[importlinter:contract:layers]
name = Layered architecture
type = layers
layers =
    adapters.http
    adapters.messaging
    application
    domain
containers =
    forno

[importlinter:contract:simulator-is-external]
name = Simulator may not import the application
type = forbidden
source_modules = simulator
forbidden_modules = forno
